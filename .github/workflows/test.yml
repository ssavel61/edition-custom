name: Tests

# Runs the Neura unit tests. Providers are mocked, so no secrets are needed
# and no live model or site is called. This workflow never deploys anything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chat-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test chat-agent/test/*.test.mjs
